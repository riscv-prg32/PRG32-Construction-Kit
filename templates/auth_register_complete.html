{% extends "base.html" %}
{% block title %}Choose a password - {{ site.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3"><i class="bi bi-key"></i> Choose a password</h1>
        <p class="text-muted small">Account: <strong>{{ email }}</strong></p>
        {% for error in errors or [] %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
        <form method="post" action="/auth/register/complete" class="vstack gap-3">
          <input type="hidden" name="token" value="{{ token }}">
          <div><label class="form-label" for="password">Password (at least 10 characters)</label>
            <input class="form-control" id="password" name="password" type="password" minlength="10" autocomplete="new-password" required></div>
          <div><label class="form-label" for="password_confirm">Type it again</label>
            <input class="form-control" id="password_confirm" name="password_confirm" type="password" minlength="10" autocomplete="new-password" required></div>
          <button class="btn btn-primary" type="submit">Create my account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
