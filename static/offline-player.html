<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="offline_player.title">Offline player - PRG32 Construction Kit</title>
  <link rel="icon" href="/static/img/prg32-icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/img/prg32-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/img/prg32-icon-180.png">
  <!-- Day or Night, as chosen in the kit's menu bar (theme.js). -->
  <script src="/static/js/theme.js"></script>
  <link href="/static/vendor/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <!-- Chinese characters without a CJK font on the computer: fetched only for characters a page shows. -->
  <link href="/static/vendor/@fontsource/noto-sans-sc/5.3.1/400.css" rel="stylesheet">
</head>
<body>
<!-- Plays a .prg32 file from this computer with the PRG32 core (WebAssembly); works without the server.
     Texts carry data-i18n keys: i18n.js shows them in the language chosen in the kit (ADR-0027). -->
<main class="container py-4">
  <h1 class="h4"><i class="bi bi-cpu"></i> <span data-i18n="offline_player.heading">Offline cartridge player</span></h1>
  <p class="text-muted"><span data-i18n="offline_player.open_from_this_computer">Open a .prg32 file from this computer. Nothing is sent anywhere.</span>
    <a href="/static/offline.html" data-i18n="offline_player.back_to_scratchpad">Back to the blocks scratchpad</a></p>
  <div class="d-flex gap-2 mb-2">
    <label class="btn btn-primary btn-sm mb-0"><i class="bi bi-folder2-open"></i> <span data-i18n="player.open_a_prg32_file">Open a .prg32 file</span>
      <input class="d-none" type="file" id="cartridgeFile" accept=".prg32,application/octet-stream"></label>
    <button class="btn btn-success btn-sm" id="playPause" type="button" disabled><i class="bi bi-play-fill"></i> <span data-i18n="common.play">Play</span></button>
  </div>
  <canvas id="playerScreen" class="prg32-screen" tabindex="0" aria-label="PRG32 screen, 320 by 200 pixels. Focus it to use the game keys." data-i18n-attr="aria-label:common.prg32_screen_320_by_200_pixels"></canvas>
  <div class="small mt-2" id="playerStatus" aria-live="polite" data-i18n="js.offline_player.no_cartridge_loaded">No cartridge loaded.</div>
</main>
<script src="/static/i18n/en.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/prg32_runtime.js"></script>
<script src="/static/js/offline_player.js"></script>
</body>
</html>
