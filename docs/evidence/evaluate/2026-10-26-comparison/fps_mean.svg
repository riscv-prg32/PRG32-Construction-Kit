<title id="chart-title">PRG32 evaluation: Frames per second</title>
<desc id="chart-desc">PRG32 evaluation: Frames per second, in Hz, for the cases clear-fill, text-overlay, sprite-storm, scrolling, mixed-gameplay. QEMU (this server) (emulator (QEMU)): clear-fill mean 52.4 (95% CI 48.3 to 56.6), n=5; text-overlay mean 58.1 (95% CI 52.7 to 63.4), n=5; sprite-storm mean 60.4 (95% CI 55.1 to 65.7), n=5; scrolling mean 59.6 (95% CI 52.1 to 67.1), n=5; mixed-gameplay mean 55.2 (95% CI 52.6 to 57.9), n=5. PRG32-QT (emulator (PRG32-QT)): clear-fill mean 6880.8 (95% CI 6472.8 to 7288.8), n=5; text-overlay mean 841.2 (95% CI 766.0 to 916.4), n=5; sprite-storm mean 4691.0 (95% CI 4086.1 to 5296.0), n=5; scrolling mean 3518.7 (95% CI 3091.8 to 3945.6), n=5; mixed-gameplay mean 1936.8 (95% CI 1783.4 to 2090.3), n=5.</desc>
