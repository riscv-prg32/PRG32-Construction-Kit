<title id="chart-title">PRG32 evaluation: Frame time, shortest</title>
<desc id="chart-desc">PRG32 evaluation: Frame time, shortest, in us, for the cases clear-fill, text-overlay, sprite-storm, scrolling, mixed-gameplay. QEMU (this server) (emulator (QEMU)): clear-fill mean 1947.6 (95% CI 582.1 to 3313.1), n=5; text-overlay mean 1210.4 (95% CI 1142.4 to 1278.4), n=5; sprite-storm mean 1453.6 (95% CI 732.6 to 2174.6), n=5; scrolling mean 1951.0 (95% CI 1158.6 to 2743.4), n=5; mixed-gameplay mean 4035.2 (95% CI 361.4 to 7709.0), n=5. PRG32-QT (emulator (PRG32-QT)): clear-fill mean 67.4 (95% CI 36.4 to 98.4), n=5; text-overlay mean 592.4 (95% CI 415.2 to 769.6), n=5; sprite-storm mean 107.4 (95% CI 81.6 to 133.2), n=5; scrolling mean 166.6 (95% CI 150.1 to 183.1), n=5; mixed-gameplay mean 298.2 (95% CI 199.8 to 396.6), n=5.</desc>
