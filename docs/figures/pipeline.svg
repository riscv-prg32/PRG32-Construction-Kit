<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" style="white-space: pre" font-family="Helvetica, Arial, sans-serif">
  <title>PRG32-Construction-Kit pipeline: from blocks to cartridges on three runtimes</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">One source of truth, three runtimes</text>
  <text x="480" y="66" text-anchor="middle" font-size="15" fill="#475569">Every step is deterministic: the same Blocks JSON always gives the same IR, the same C and the same cartridge.</text>

  <!-- authoring column -->
  <g font-size="15">
    <rect x="30" y="100" width="190" height="80" rx="12" fill="#fde68a" stroke="#b45309"/>
    <text x="125" y="133" text-anchor="middle" font-weight="bold" fill="#78350f">Blockly editor</text>
    <text x="125" y="156" text-anchor="middle" fill="#78350f">students drag blocks</text>

    <rect x="30" y="230" width="190" height="80" rx="12" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="125" y="263" text-anchor="middle" font-weight="bold" fill="#312e81">Blocks JSON</text>
    <text x="125" y="286" text-anchor="middle" fill="#312e81">projects.blocks_json</text>

    <rect x="30" y="360" width="190" height="80" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="125" y="393" text-anchor="middle" font-weight="bold" fill="#14532d">Game IR</text>
    <text x="125" y="416" text-anchor="middle" fill="#14532d">checked expressions</text>
  </g>
  <line x1="125" y1="180" x2="125" y2="226" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="310" x2="125" y2="356" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- simulator branch -->
  <rect x="300" y="360" width="200" height="80" rx="12" fill="#f1f5f9" stroke="#475569"/>
  <text x="400" y="393" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Browser simulator</text>
  <text x="400" y="416" text-anchor="middle" font-size="14" fill="#334155">JavaScript, 30 FPS</text>
  <line x1="220" y1="400" x2="296" y2="400" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- C branch -->
  <rect x="300" y="230" width="200" height="80" rx="12" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="400" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">Generated C</text>
  <text x="400" y="286" text-anchor="middle" font-size="14" fill="#7f1d1d">init / update / draw + helpers</text>
  <path d="M220,385 C260,385 260,270 296,270" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="300" y="100" width="200" height="80" rx="12" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="400" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">PRG32 builder</text>
  <text x="400" y="149" text-anchor="middle" font-size="13" fill="#4c1d95">riscv32-esp-elf-gcc rv32imc</text>
  <text x="400" y="167" text-anchor="middle" font-size="13" fill="#4c1d95">portable ABI table</text>
  <line x1="400" y1="230" x2="400" y2="184" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- cartridge -->
  <rect x="580" y="100" width="150" height="80" rx="12" fill="#0f172a"/>
  <text x="655" y="133" text-anchor="middle" font-size="17" font-weight="bold" fill="#facc15">.prg32</text>
  <text x="655" y="156" text-anchor="middle" font-size="13" fill="#e2e8f0">PRG2 cartridge</text>
  <line x1="500" y1="140" x2="576" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- runtimes -->
  <g font-size="14">
    <rect x="790" y="90" width="150" height="70" rx="10" fill="#ecfeff" stroke="#0e7490"/>
    <text x="865" y="119" text-anchor="middle" font-weight="bold" fill="#164e63">ESP32-C6 board</text>
    <text x="865" y="140" text-anchor="middle" fill="#164e63">esp32c6 cartridge</text>
    <rect x="790" y="185" width="150" height="70" rx="10" fill="#ecfeff" stroke="#0e7490"/>
    <text x="865" y="214" text-anchor="middle" font-weight="bold" fill="#164e63">QEMU</text>
    <text x="865" y="235" text-anchor="middle" fill="#164e63">ESP32-C3 firmware</text>
    <rect x="790" y="280" width="150" height="70" rx="10" fill="#ecfeff" stroke="#0e7490"/>
    <text x="865" y="309" text-anchor="middle" font-weight="bold" fill="#164e63">PRG32-QT</text>
    <text x="865" y="330" text-anchor="middle" fill="#164e63">RV32IMAC host</text>
    <rect x="790" y="375" width="150" height="70" rx="10" fill="#fefce8" stroke="#a16207"/>
    <text x="865" y="404" text-anchor="middle" font-weight="bold" fill="#713f12">Cartridge Store</text>
    <text x="865" y="425" text-anchor="middle" fill="#713f12">publish bundle</text>
  </g>
  <path d="M730,130 L786,125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M730,145 C760,150 760,220 786,220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M730,160 C770,170 760,315 786,315" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M700,180 C720,300 760,410 786,410" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <text x="480" y="500" text-anchor="middle" font-size="14" fill="#475569">Tools: tools/simulate.js runs the simulator headless; tools/runtime_check.py builds every example and runs it on PRG32-QT and QEMU.</text>
</svg>
