<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">From Blocks, C or assembly to a PRG32 cartridge</title>
  <desc id="desc">Three ways to write a game: Blocks, Advanced C and handwritten assembly. Blocks are saved as JSON and turned into a validated game IR; C and assembly are checked by the validators before anything is compiled. The deterministic generators write C and, on request, RV32IM assembly that does exactly what the C does, with explanations; AudioStudio&#x27;s sounds become an AUD0 block. The PRG32 toolchain in the build sandbox makes a .prg32 cartridge (a debug build adds source maps and is byte-identical). The cartridge runs in the browser&#x27;s WebAssembly runtime with the debugger, on PRG32-QT, in QEMU, on a PRG32 console (not verified) or goes to the Cartridge Store as a reviewed bundle. Run makes the same cartridge for the IDE&#x27;s simulator, also for guests, and keeps nothing; Compile keeps it for download and publishing (signed in).</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1240" height="590" fill="#ffffff"/>
  <text x="620" y="34" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="bold">One validated, deterministic pipeline</text>
  <text x="620" y="58" font-size="13" text-anchor="middle" fill="#475569">The same saved project always gives the same IR, the same C and assembly, and the same cartridge.</text>
