  <text x="280" y="240" font-size="12.5" fill="#475569">portable ABI, no libc</text>
  <rect x="270" y="310" width="210" height="70" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="280" y="331" font-size="14" font-weight="bold" fill="#0f172a">Assembly validator</text>
