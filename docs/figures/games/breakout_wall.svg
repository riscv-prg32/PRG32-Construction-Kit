  <rect x="380" y="330" width="10" height="10" fill="#facc15"/>
  <circle cx="385" cy="335" r="2" fill="#ef4444"/>
  <text x="400" y="345" font-size="13" fill="#facc15">ball centre (ball_x + 2, ball_y + 2)</text>
  <g font-size="15" fill="#0f172a">
    <text x="710" y="95" font-weight="bold">From position to brick</text>
    <text x="710" y="122" font-family="Menlo, monospace" font-size="14">col = (x + 2 - 5) / 31</text>
    <text x="710" y="144" font-family="Menlo, monospace" font-size="14">row = (y + 2 - 30) / 12</text>
    <text x="710" y="166" font-family="Menlo, monospace" font-size="14">i = row * 10 + col</text>
    <text x="710" y="210" font-weight="bold">From brick to position</text>
    <text x="710" y="237" font-family="Menlo, monospace" font-size="14">x = 5 + (i % 10) * 31</text>
    <text x="710" y="259" font-family="Menlo, monospace" font-size="14">y = 30 + (i / 10) * 12</text>
    <text x="710" y="281" font-size="13" fill="#475569">brick 29 x 10 px, gap 2 px</text>
    <text x="710" y="320" font-weight="bold">Row colour</text>
    <text x="710" y="345" font-family="Menlo, monospace" font-size="14">row_color[i / 10]</text>
    <text x="710" y="367" font-size="13" fill="#475569">rgb(r, g, b) packs RGB565</text>
  </g>
  <text x="40" y="440" font-size="15" font-weight="bold" fill="#0f172a">In memory: static int bricks[60];</text>
