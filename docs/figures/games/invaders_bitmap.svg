  <text x="815" y="262" text-anchor="middle" font-size="13" fill="#475569">if march % 2 == 0 draw pose 0, else pose 1</text>
  <rect x="690" y="290" width="250" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="705" y="314" font-size="13" fill="#0f172a">size 2: every bit becomes a</text>
  <text x="705" y="332" font-size="13" fill="#0f172a">2 x 2 rectangle, so the 8 x 8</text>
  <text x="705" y="350" font-size="13" fill="#0f172a">picture is drawn 16 x 16.</text>
  <text x="705" y="370" font-size="13" fill="#0f172a">'.' pixels are see-through.</text>
  <text x="40" y="430" font-size="15" fill="#0f172a" font-family="Menlo, monospace">static const uint8_t prg32_kit_bitmap_2[8] = {0x24, 0x18, 0x3C, 0x66, 0xFF, 0xBD, 0xA5, 0x18};</text>
  <text x="40" y="470" font-size="14" fill="#475569">The generator stores each different picture once and names it; the same bytes also feed prg32_sprite_draw_8x8</text>
  <text x="40" y="490" font-size="14" fill="#475569">and prg32_tile_define in the PRG32 firmware, which read sprites and tiles in exactly this format.</text>
