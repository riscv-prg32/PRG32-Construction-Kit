  <text x="330" y="128" font-family="Menlo, monospace" font-size="16" fill="#0f172a">"..#..#.."</text><text x="470" y="128" font-family="Menlo, monospace" font-size="16" fill="#0f172a">00100100</text><text x="580" y="128" font-family="Menlo, monospace" font-size="16" fill="#7c3aed">0x24</text><text x="330" y="164" font-family="Menlo, monospace" font-size="16" fill="#0f172a">"...##..."</text><text x="470" y="164" font-family="Menlo, monospace" font-size="16" fill="#0f172a">00011000</text><text x="580" y="164" font-family="Menlo, monospace" font-size="16" fill="#7c3aed">0x18</text><text x="330" y="200" font-family="Menlo, monospace" font-size="16" fill="#0f172a">"..####.."</text><text x="470" y="200" font-family="Menlo, monospace" font-size="16" fill="#0f172a">00111100</text><text x="580" y="200" font-family="Menlo, monospace" font-size="16" fill="#7c3aed">0x3C</text><text x="330" y="236" font-family="Menlo, monospace" font-size="16" fill="#0f172a">".##..##."</text><text x="470" y="236" font-family="Menlo, monospace" font-size="16" fill="#0f172a">01100110</text><text x="580" y="236" font-family="Menlo, monospace" font-size="16" fill="#7c3aed">0x66</text><text x="330" y="272" font-family="Menlo, monospace" font-size="16" fill="#0f172a">"########"</text><text x="470" y="272" font-family="Menlo, monospace" font-size="16" fill="#0f172a">11111111</text><text x="580" y="272" font-family="Menlo, monospace" font-size="16" fill="#7c3aed">0xFF</text><text x="330" y="308" font-family="Menlo, monospace" font-size="16" fill="#0f172a">"#.####.#"</text><text x="470" y="308" font-family="Menlo, monospace" font-size="16" fill="#0f172a">10111101</text><text x="580" y="308" font-family="Menlo, monospace" font-size="16" fill="#7c3aed">0xBD</text><text x="330" y="344" font-family="Menlo, monospace" font-size="16" fill="#0f172a">"#.#..#.#"</text><text x="470" y="344" font-family="Menlo, monospace" font-size="16" fill="#0f172a">10100101</text><text x="580" y="344" font-family="Menlo, monosp