<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" style="white-space: pre" font-family="Helvetica, Arial, sans-serif">
  <title>Breakout: the paddle decides the bounce angle</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#0f172a">Steering the ball: where it lands on the paddle sets ball_dx</text>
  <rect x="40" y="70" width="880" height="300" rx="12" fill="#000"/>
  <!-- paddle drawn at 16x: 40 px -> 640 px -->
  <rect x="160" y="300" width="640" height="40" fill="#fff"/>
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="160" y="300" width="80" height="40" fill="#fca5a5"/><text x="200" y="326">-4</text>
    <rect x="240" y="300" width="80" height="40" fill="#fdba74"/><text x="280" y="326">-3 / -2</text>
    <rect x="320" y="300" width="80" height="40" fill="#fde68a"/><text x="360" y="326">-2 / -1</text>
    <rect x="400" y="300" width="80" height="40" fill="#d9f99d"/><text x="440" y="326">-1 / 1</text>
    <rect x="480" y="300" width="80" height="40" fill="#d9f99d"/><text x="520" y="326">1</text>
    <rect x="560" y="300" width="80" height="40" fill="#fde68a"/><text x="600" y="326">1 / 2</text>
    <rect x="640" y="300" width="80" height="40" fill="#fdba74"/><text x="680" y="326">2 / 3</text>
    <rect x="720" y="300" width="80" height="40" fill="#fca5a5"/><text x="760" y="326">3 / 4</text>
  </g>
  <line x1="480" y1="290" x2="480" y2="350" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="480" y="365" text-anchor="middle" font-size="13" fill="#fca5a5">paddle centre: paddle_x + 20</text>
  <!-- trajectories -->
  <line x1="300" y1="110" x2="225" y2="296" stroke="#facc15" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="225" y1="296" x2="110" y2="150" stroke="#facc15" stroke-width="3" marker-end="url(#a)"/>
  <line x1="560" y1="110" x2="505" y2="296" stroke="#facc15" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="505" y1="296" x2="530" y2="130" stroke="#facc15" stroke-width="3" marker-end="url(#a)"/>
  <line x1="650" y1="110" x2="770" y2="296" stroke="#facc15" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="770" y1="296" x2="900" y2="140" stroke="#facc15" stroke-width="3" marker-end="url(#a)"/>
  <text x="70" y="100" font-size="14" fill="#e2e8f0">edge: steep sideways</text>
  <text x="520" y="100" font-size="14" fill="#e2e8f0">centre: almost straight up</text>
  <rect x="40" y="395" width="880" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="430" font-size="16" fill="#0f172a" font-family="Menlo, monospace">ball_dx = clamp((ball_x + 2 - (paddle_x + 20)) / 4, -4, 4)</text>
  <text x="70" y="458" font-size="16" fill="#0f172a" font-family="Menlo, monospace">ball_dy = -3 - (bricks_left &lt; 30)</text>
  <text x="70" y="490" font-size="14" fill="#475569">The comparison (bricks_left &lt; 30) is 1 or 0, so the ball speeds up once half of the wall is gone.</text>
  <text x="70" y="508" font-size="14" fill="#475569">If ball_dx would be 0 it becomes 1: a perfectly vertical ball could bounce forever without hitting a brick.</text>
</svg>
