  <text x="723" y="606" font-size="11" text-anchor="middle" fill="#ffffff">retention</text>
  <rect x="770" y="594" width="70" height="17" rx="8" fill="#15803d"/>
  <text x="804" y="606" font-size="11" text-anchor="middle" fill="#ffffff">verified</text>
  <rect x="847" y="594" width="84" height="17" rx="8" fill="#64748b"/>
