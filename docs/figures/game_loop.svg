<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The PRG32 game loop</title>
  <desc id="desc">The firmware owns the loop; a cartridge provides game_init, game_update and game_draw. Init runs once and sets the state S(0). Every frame (33 ms, about 30 per second) update reads the buttons u(t) and computes S(t+1) = update(S(t), u(t)); draw paints the 320 x 200 RGB565 framebuffer from S(t+1); the firmware presents it and waits for the next frame. Audio calls made during frame N take effect at N x 33 ms (the frame clock).</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="bold">The game loop: a discrete-time system</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#475569">The firmware owns the loop; a cartridge only provides three functions.</text>
  <rect x="40" y="110" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="50" y="131" font-size="14" font-weight="bold" fill="#0f172a">game_init()</text>
  <text x="50" y="150" font-size="12.5" fill="#475569">runs once: state S(0)</text>
  <rect x="360" y="110" width="240" height="80" rx="10" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="370" y="131" font-size="14" font-weight="bold" fill="#0f172a">game_update()</text>
  <text x="370" y="150" font-size="12.5" fill="#475569">every frame: S(t+1) =</text>
  <text x="370" y="167" font-size="12.5" fill="#475569">update(S(t), u(t))</text>
  <rect x="360" y="260" width="240" height="80" rx="10" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="370" y="281" font-size="14" font-weight="bold" fill="#0f172a">game_draw()</text>
  <text x="370" y="300" font-size="12.5" fill="#475569">every frame: image(t) =</text>
  <text x="370" y="317" font-size="12.5" fill="#475569">draw(S(t+1)), painter&#x27;s order</text>
  <rect x="700" y="110" width="220" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="710" y="131" font-size="14" font-weight="bold" fill="#0f172a">input u(t)</text>
  <text x="710" y="150" font-size="12.5" fill="#475569">prg32_input_read()</text>
  <text x="710" y="167" font-size="12.5" fill="#475569">button bit mask</text>
  <rect x="700" y="260" width="220" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="710" y="281" font-size="14" font-weight="bold" fill="#0f172a">320 x 200 screen</text>
  <text x="710" y="300" font-size="12.5" fill="#475569">RGB565 framebuffer</text>
  <rect x="40" y="260" width="220" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="50" y="281" font-size="14" font-weight="bold" fill="#0f172a">present, wait</text>
  <text x="50" y="300" font-size="12.5" fill="#475569">next frame at +33 ms</text>
  <rect x="240" y="390" width="480" height="64" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="250" y="411" font-size="14" font-weight="bold" fill="#0f172a">Audio: the frame clock</text>
  <text x="250" y="430" font-size="12.5" fill="#475569">calls in frame N take effect at N x 33 ms; 20 ms buffers</text>
  <path d="M260,150 L360,150" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700,150 L600,150" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M480,190 L480,260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,300 L700,300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360,300 L260,300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M150,260 L150,230 L420,230 L420,190" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="224" font-size="12" text-anchor="middle" fill="#0f172a" paint-order="stroke" stroke="#ffffff" stroke-width="4">next frame</text>
  <text x="480" y="480" font-size="13" text-anchor="middle" fill="#475569">About 30 frames per second: a 33 ms budget for update + draw on a 160 MHz RISC-V core.</text>
</svg>
