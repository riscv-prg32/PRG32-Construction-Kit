<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" style="white-space: pre" font-family="Helvetica, Arial, sans-serif">
  <title>The PRG32 game loop: init once, then update and draw every frame</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">The game loop: a discrete-time system</text>
  <text x="480" y="68" text-anchor="middle" font-size="15" fill="#475569">The firmware owns the loop; a cartridge only provides three functions.</text>

  <rect x="60" y="120" width="230" height="90" rx="14" fill="#fde68a" stroke="#b45309"/>
  <text x="175" y="155" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">when game starts</text>
  <text x="175" y="182" text-anchor="middle" font-size="15" fill="#78350f" font-family="Menlo, monospace">game_init()</text>
  <text x="175" y="236" text-anchor="middle" font-size="14" fill="#475569">runs once: state S(0)</text>
  <line x1="290" y1="165" x2="386" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="390" y="120" width="230" height="90" rx="14" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="505" y="155" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">every frame update</text>
  <text x="505" y="182" text-anchor="middle" font-size="15" fill="#1e3a8a" font-family="Menlo, monospace">game_update()</text>

  <rect x="390" y="320" width="230" height="90" rx="14" fill="#bbf7d0" stroke="#15803d"/>
  <text x="505" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">every frame draw</text>
  <text x="505" y="382" text-anchor="middle" font-size="15" fill="#14532d" font-family="Menlo, monospace">game_draw()</text>

  <line x1="505" y1="210" x2="505" y2="316" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M390,365 C300,365 300,280 360,250 C380,238 380,215 395,200" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="170" y="300" font-size="14" fill="#334155">present frame,</text>
  <text x="170" y="318" font-size="14" fill="#334155">wait for the next</text>

  <rect x="690" y="120" width="220" height="90" rx="14" fill="#f1f5f9" stroke="#64748b"/>
  <text x="800" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">input u(t)</text>
  <text x="800" y="176" text-anchor="middle" font-size="14" fill="#334155" font-family="Menlo, monospace">prg32_input_read()</text>
  <text x="800" y="196" text-anchor="middle" font-size="13" fill="#334155">button bit mask</text>
  <line x1="690" y1="165" x2="624" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="690" y="320" width="220" height="90" rx="14" fill="#0f172a"/>
  <text x="800" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#facc15">320 x 200 screen</text>
  <text x="800" y="376" text-anchor="middle" font-size="13" fill="#e2e8f0">RGB565 framebuffer</text>
  <text x="800" y="396" text-anchor="middle" font-size="13" fill="#e2e8f0">painter's algorithm</text>
  <line x1="620" y1="365" x2="686" y2="365" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="120" y="450" width="720" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="475" text-anchor="middle" font-size="17" fill="#0f172a" font-family="Menlo, monospace">S(t+1) = update(S(t), u(t))</text>
  <text x="650" y="475" text-anchor="middle" font-size="17" fill="#0f172a" font-family="Menlo, monospace">image(t) = draw(S(t+1))</text>
  <text x="480" y="498" text-anchor="middle" font-size="14" fill="#475569">about 30 frames per second: a 33 ms budget for update + draw on a 160 MHz RISC-V core</text>
</svg>
